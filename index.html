
<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CerebroAC | Intelligence OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      :root {
        --color-bg-950: #090d16;
        --color-bg-900: #0f172a;
        --color-bg-800: #1e293b;
        --color-bg-700: #334155;
        --color-accent: #2563eb;
        --color-accent-glow: rgba(37, 99, 235, 0.2);
        --color-accent-hover: #3b82f6;
        --text-main: #f8fafc;
      }

      /* Tactical / Military Theme */
      html.tactical {
        --color-bg-950: #040d06;
        --color-bg-900: #0b1a0e;
        --color-bg-800: #132a18;
        --color-bg-700: #1c3d24;
        --color-accent: #16a34a;
        --color-accent-glow: rgba(22, 163, 74, 0.2);
        --color-accent-hover: #22c55e;
      }

      /* Light Theme */
      html.light {
        --color-bg-950: #f8fafc;
        --color-bg-900: #ffffff;
        --color-bg-800: #f1f5f9;
        --color-bg-700: #e2e8f0;
        --color-accent: #2563eb;
        --color-accent-glow: rgba(37, 99, 235, 0.15);
        --color-accent-hover: #1d4ed8;
        --text-main: #0f172a;
      }

      body { 
        background-color: var(--color-bg-950); 
        color: var(--text-main); 
        overflow: hidden; 
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease;
      }
      
      .bg-grid {
        background-image: 
          linear-gradient(var(--color-accent-glow) 0.5px, transparent 0.5px),
          linear-gradient(90deg, var(--color-accent-glow) 0.5px, transparent 0.5px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      html.light .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: rgba(148, 163, 184, 0.2); 
        border-radius: 4px; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
        background: rgba(148, 163, 184, 0.4); 
      }
      
      .material-symbols-outlined { 
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; 
        transition: color 0.2s ease, transform 0.2s ease;
      }
      
      .filled-icon { font-variation-settings: 'FILL' 1; }

      .leaflet-container { background: var(--color-bg-950) !important; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
