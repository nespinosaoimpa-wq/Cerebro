
<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CerebroAC | Intelligence OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- PDF.js for Client Side Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              nexus: {
                950: 'var(--color-bg-950)', 
                900: 'var(--color-bg-900)', 
                800: 'var(--color-bg-800)', 
                700: 'var(--color-bg-700)', 
                600: '#64748b', 
                border: '#334155', 
                accent: 'var(--color-accent)', 
                accentHover: 'var(--color-accent-hover)',
                success: '#10b981',
                warning: '#f59e0b',
                danger: '#ef4444',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in': 'slideIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideIn: {
                '0%': { transform: 'translateX(20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg-950: #090d16;
        --color-bg-900: #0f172a;
        --color-bg-800: #1e293b;
        --color-bg-700: #334155;
        --color-accent: #2563eb;
        --color-accent-glow: rgba(37, 99, 235, 0.2);
        --color-accent-hover: #3b82f6;
        --text-main: #f8fafc;
      }

      /* Tactical / Military Theme */
      html.tactical {
        --color-bg-950: #040d06;
        --color-bg-900: #0b1a0e;
        --color-bg-800: #132a18;
        --color-bg-700: #1c3d24;
        --color-accent: #16a34a;
        --color-accent-glow: rgba(22, 163, 74, 0.2);
        --color-accent-hover: #22c55e;
      }

      /* Light Theme */
      html.light {
        --color-bg-950: #f8fafc;
        --color-bg-900: #ffffff;
        --color-bg-800: #f1f5f9;
        --color-bg-700: #e2e8f0;
        --color-accent: #2563eb;
        --color-accent-glow: rgba(37, 99, 235, 0.15);
        --color-accent-hover: #1d4ed8;
        --text-main: #0f172a;
      }

      body { 
        background-color: var(--color-bg-950); 
        color: var(--text-main); 
        overflow: hidden; 
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease;
      }
      
      .bg-grid {
        background-image: 
          linear-gradient(var(--color-accent-glow) 0.5px, transparent 0.5px),
          linear-gradient(90deg, var(--color-accent-glow) 0.5px, transparent 0.5px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      html.light .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: rgba(148, 163, 184, 0.2); 
        border-radius: 4px; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { 
        background: rgba(148, 163, 184, 0.4); 
      }
      
      .material-symbols-outlined { 
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; 
        transition: color 0.2s ease, transform 0.2s ease;
      }
      
      .filled-icon { font-variation-settings: 'FILL' 1; }

      .leaflet-container { background: var(--color-bg-950) !important; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
