
<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CerebroAC | Intelligence OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- PDF.js for Client Side Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              nexus: {
                950: 'var(--color-bg-950)', 
                900: 'var(--color-bg-900)', 
                800: 'var(--color-bg-800)', 
                700: 'var(--color-bg-700)', 
                600: '#64748b', 
                border: '#334155', 
                accent: 'var(--color-accent)', 
                accentHover: 'var(--color-accent-hover)',
                success: '#10b981',
                warning: '#f59e0b',
                danger: '#ef4444',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in': 'slideIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideIn: {
                '0%': { transform: 'translateX(20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-bg-950: #020617;
        --color-bg-900: #0f172a;
        --color-bg-800: #1e293b;
        --color-bg-700: #334155;
        --color-accent: #3b82f6;
        --color-accent-glow: rgba(59, 130, 246, 0.5);
        --color-accent-hover: #60a5fa;
        --text-main: #f8fafc;
        --hologram-opacity: 0.15;
      }

      /* Tactical Theme Overrides (2026 Military Grade) */
      html.tactical {
        --color-bg-950: #050a05;
        --color-bg-900: #0a1a0a;
        --color-bg-800: #152a15;
        --color-bg-700: #1a3a1a;
        --color-accent: #22c55e;
        --color-accent-glow: rgba(34, 197, 94, 0.5);
        --color-accent-hover: #4ade80;
      }

      body { 
        background-color: var(--color-bg-950); 
        color: var(--text-main); 
        overflow: hidden; 
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        perspective: 1000px;
      }
      
      .bg-grid {
        background-image: 
          linear-gradient(var(--color-accent-glow) 0.5px, transparent 0.5px),
          linear-gradient(90deg, var(--color-accent-glow) 0.5px, transparent 0.5px);
        background-size: 50px 50px;
        mask-image: radial-gradient(circle at center, black, transparent 80%);
      }

      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      .holographic-border {
        position: relative;
        overflow: hidden;
      }

      .holographic-border::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          transparent, 
          var(--color-accent), 
          transparent 30%
        );
        animation: rotate 4s linear infinite;
        opacity: var(--hologram-opacity);
      }

      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }

      .scanning-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
        box-shadow: 0 0 15px var(--color-accent);
        top: -2px;
        animation: scan 3s linear infinite;
        z-index: 50;
        pointer-events: none;
      }

      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      .cyber-button {
        position: relative;
        clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        transition: all 0.3s ease;
      }

      .cyber-button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 4px 4px 0 var(--color-accent);
      }

      .cyber-button::after {
        content: attr(data-text);
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: var(--color-accent);
        display: flex; align-items: center; justify-content: center;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }

      .cyber-button:hover::after {
        transform: translateX(0);
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { 
        background: linear-gradient(transparent, var(--color-accent), transparent); 
        border-radius: 10px; 
      }
      
      .material-symbols-outlined { 
        font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; 
        transition: all 0.3s ease;
      }
      
      .filled-icon { font-variation-settings: 'FILL' 1; }

      .card-3d {
        transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        transform-style: preserve-3d;
      }

      .leaflet-container { background: var(--color-bg-950) !important; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
